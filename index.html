<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event-Driven Counter</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="counter-card">
        <h1>Counter App</h1>
        <p class="description">Click to change your count.</p>

        <p id="count" aria-live="polite">0</p>

        <div class="buttons">
            <button id="increase-btn">Increase +</button>
            <button id="reset-btn">Reset</button>
        </div>
    </main>
</body>
</html>
